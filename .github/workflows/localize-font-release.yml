name: Use Korean font package filename
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [docs/releases/v0.1.3.md]
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Rename font package and update checksum and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, tempfile, time
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          tag = 'v0.1.3'
          old = f'Fallout34-Korean-Patcher-{tag}-Font-Only-MO2.zip'
          new = old
          label = f'폰트 전용 - MO2 설치용 ({tag}).zip'
          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True, encoding='utf-8')
          release = None
          for attempt in range(36):
              result = subprocess.run(['gh','api',f'repos/{repo}/releases/tags/{tag}'], capture_output=True, text=True, encoding='utf-8')
              if result.returncode == 0:
                  candidate = json.loads(result.stdout)
                  if not candidate['draft']:
                      release = candidate
                      break
              time.sleep(10)
          if release is None:
              raise RuntimeError('Published release not available')
          assets = {a['name']: a for a in release['assets']}
          name = next((n for n in assets if n.endswith('-MO2.zip')), None)
          if name not in assets:
              raise RuntimeError('Font ZIP missing')
          with tempfile.TemporaryDirectory() as temp:
              gh('release','download',tag,'--repo',repo,'--pattern',name,'--dir',temp)
              digest = hashlib.sha256((Path(temp)/name).read_bytes()).hexdigest()
              checksum = Path(temp)/(new+'.sha256')
              checksum.write_text(f'{digest}  {new}\n',encoding='utf-8')
              gh('api','--method','PATCH',f"repos/{repo}/releases/assets/{assets[name]['id']}",'-f',f'name={new}','-f',f'label={label}')
              gh('release','upload',tag,str(checksum),'--repo',repo,'--clobber')
          for stale in assets:
              if stale.endswith('-MO2.zip.sha256') and stale != new+'.sha256':
                  gh('release','delete-asset',tag,stale,'--repo',repo,'--yes')
          refreshed = json.loads(gh('api',f'repos/{repo}/releases/{release["id"]}/assets'))
          for asset in refreshed:
              if asset['name'] == new+'.sha256':
                  asset_label = '폰트 전용 - SHA256 확인파일'
              elif asset['name'].endswith('-Windows-x64.zip'):
                  asset_label = '전체 설치기 - Windows 64비트.zip'
              elif asset['name'].endswith('-Windows-x64.zip.sha256'):
                  asset_label = '전체 설치기 - SHA256 확인파일'
              else:
                  continue
              gh('api','--method','PATCH',f"repos/{repo}/releases/assets/{asset['id']}",'-f',f'label={asset_label}')
          gh('release','edit',tag,'--repo',repo,'--notes-file',f'docs/releases/{tag}.md')
          print('Published font ZIP:',new)
          print('SHA256:',digest)
          PY
