name: Build and publish Windows release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/release-version.txt]
permissions:
  contents: write
concurrency:
  group: fallout34-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Read release version
        shell: pwsh
        run: |
          $version = (Get-Content tools/release-version.txt -Raw).Trim()
          if ($version -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          if (!(Test-Path "docs/releases/$version.md")) { throw 'Release notes missing' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Install Windows packager
        run: python -m pip install PyInstaller==6.11.1
      - name: Build and verify full installer ZIP
        run: python tools/build_windows_release.py --version $env:RELEASE_VERSION
      - name: Verify standalone executable bundle
        shell: pwsh
        run: |
          $process = Start-Process -FilePath work/windows_release/dist/Fallout34-Korean-Patcher/Fallout34-Korean-Patcher.exe -ArgumentList '--verify-bundle' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Standalone verification failed: $($process.ExitCode)" }
      - name: Package font-only MO2 ZIP and checksum
        shell: pwsh
        run: |
          @'
          import hashlib, os, zipfile
          from pathlib import Path
          root = Path('.')
          version = os.environ['RELEASE_VERSION']
          archive = root / 'dist' / f'Fallout34-폰트전용-{version}-MO2.zip'
          font = root / 'assets/fo4_korean/Interface/fonts_en.swf'
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED, compresslevel=8) as output:
              output.write(font, 'Interface/fonts_en.swf')
              output.write(root / 'docs/releases' / f'{version}.md', 'README.md')
              output.write(root / 'licenses/NotoSansKR-OFL.txt', 'licenses/NotoSansKR-OFL.txt')
          with zipfile.ZipFile(archive) as check:
              assert check.testzip() is None
              assert check.read('Interface/fonts_en.swf') == font.read_bytes()
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          Path(str(archive) + '.sha256').write_text(f'{digest}  {archive.name}\n', encoding='utf-8')
          print(archive, digest)
          '@ | python -
      - uses: actions/upload-artifact@v4
        with:
          name: Fallout34-release-packages
          path: dist/*
          retention-days: 30
      - name: Publish verified release packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_VERSION
          gh release view $version --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $version already exists; refusing to overwrite" }
          $assets = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 4) { throw 'Expected two ZIPs and two SHA-256 files' }
          gh release create $version @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "$version - 단말기 해킹 폰트 수정" --notes-file "docs/releases/$version.md" --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release creation/upload failed' }
          gh release edit $version --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
